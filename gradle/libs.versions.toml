[versions]
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.10"
compileSdk = "37"
minSdk = "26"
targetSdk = "37"
jvmTarget = "17"

composeBom = "2026.08.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
coroutines = "1.11.0"

junit5 = "6.1.3"
androidxJunit = "1.3.0"
espresso = "3.7.0"
mockk = "1.14.11"
turbine = "1.2.1"
truth = "1.4.5"



[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
